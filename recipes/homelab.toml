# Recipe: homelab -- your dashboards, past the fleet panel.
#
# Two tabs for `phosphor prom` and `phosphor ci`. Until [prometheus] and
# [[ci.pipelines]] are in your profile, each says what it needs there
# (and picks it up as soon as you save).
#
#   phosphor recipe homelab            drops this into ~/.config/phosphor/tabs.d/,
#                                       then `phosphor gen`
#   phosphor recipe --remove homelab   takes it back out

[[tabs]]
name  = "PROM"
panes = [ { cmd = "phosphor prom" } ]

[[tabs]]
name  = "CI"
panes = [ { cmd = "phosphor ci" } ]
