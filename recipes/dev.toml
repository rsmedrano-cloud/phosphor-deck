# Recipe: dev -- a two-assistant tab, on demand.
#
# The same shape `phosphor init`'s "dev" answer starts you with, as a
# recipe you can add to a deck that already exists. Swap either program
# for your own with Alt-r once it's in.
#
#   phosphor recipe dev   drops this into ~/.config/phosphor/tabs.d/,
#                          then `phosphor gen`

[[tabs]]
name  = "DEV"
split = "cols"
panes = [
  { cmd = "claude" },
  { cmd = "codex" },
]

# How to get what its panes run, for `phosphor recipe` to say (or, for
# what `phosphor store` carries, to offer). "package": your package manager.
[recipe.install]
claude   = "npm install -g @anthropic-ai/claude-code"
codex    = "npm install -g @openai/codex"
