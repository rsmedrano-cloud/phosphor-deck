# Recipe: assistant workbench -- four AI CLIs side by side, for comparing
# answers or splitting a task across them.
#
#   phosphor recipe workbench   drops this into ~/.config/phosphor/tabs.d/,
#                                then `phosphor gen`

[[tabs]]
name  = "WORKBENCH"
split = "cols"
panes = [
  { split = "rows", panes = [
      { cmd = "claude" },
      { cmd = "gemini" },
  ]},
  { split = "rows", panes = [
      { cmd = "codex" },
      { cmd = "opencode" },
  ]},
]

# How to get what its panes run, for `phosphor recipe` to say (or, for
# what `phosphor store` carries, to offer). "package": your package manager.
[recipe.install]
claude   = "npm install -g @anthropic-ai/claude-code"
gemini   = "npm install -g @google/gemini-cli"
codex    = "npm install -g @openai/codex"
opencode = "npm install -g opencode-ai"
