# Every job runs on the brain's own runner (tag homelab, docker executor with
# the docker socket), and only for protected refs (main, dev, v* tags): the
# runner takes nothing else, so code from a merge request never runs on
# anyone's machine. The project is private, so GitLab's shared runners would
# spend its CI minutes.
#
# check: the fast checks. Seconds; no network.
#
# install: a clean install in a systemd container, then a first-time user
# driving it on a real terminal, on the brain's docker.
check:
  tags: [homelab]
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  image: python:3.12-slim
  script:
    - sh tests/check.sh

# zellij: the deck's keys in a real zellij (the latest release, as installs
# get), with a client attached in a pty: Alt-r edits, saves, puts back and
# swaps a pane. A throwaway session in its own HOME.
zellij:
  tags: [homelab]
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  image: python:3.12-slim
  script:
    - python3 tests/fetch-zellij.py /usr/local/bin
    - zellij --version
    - python3 tests/edit-check.py
    - python3 tests/notify-floats-check.py
    - python3 tests/tabmark-check.py
    - python3 tests/hotswap-live-check.py

# docs: a push that changes code (lib/, phosphor, share/, install.sh) also
# changes CHANGELOG.md, and the docs name every command. [no-changelog] in a
# commit message waives the first for a refactor users never see.
docs:
  tags: [homelab]
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  image: alpine:3.20
  variables:
    GIT_DEPTH: "200"
  before_script:
    - apk add --no-cache git python3 >/dev/null
  script:
    - python3 tests/docs-check.py "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA"

# site: doc/manual/* -> site/src/content/docs/* (tests/site-check.py, in
# check.sh, already catches a stale one) actually builds -- the same
# Astro + Starlight build .github/workflows/pages.yml runs to publish it,
# so a broken build is caught here, not after it reaches the mirror.
site:
  tags: [homelab]
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  image: node:22-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 >/dev/null
  script:
    - python3 doc/site/build.py
    - cd site && npm ci && npm run build

install:
  tags: [homelab]
  # docker CLI talking to the brain's docker through its socket: the test
  # containers (privileged, with systemd) run on the brain, this one doesn't
  image: docker:27-cli
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  timeout: 30m
  before_script:
    - apk add --no-cache python3 git
  script:
    - python3 tests/update-check.py
    - sh tests/from-zero.sh
    - python3 tests/tester-sim.py

# distros: the same install from zero (tests/from-zero.sh) on the other
# distros the brain is meant to run on, one job each, in a systemd container.
distros:
  tags: [homelab]
  image: docker:27-cli
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  timeout: 30m
  parallel:
    matrix:
      - DISTRO: [ubuntu, fedora, arch]
  before_script:
    - apk add --no-cache git
  script:
    - sh tests/from-zero.sh

# rust-test: cargo test for both optional Rust rewrites, natively, on every
# protected push -- unlike rust-release below, no cross-compiling, so it's
# cheap enough to run every time, not just at a tag. Added after a real gap:
# their own unit tests (parity checks against lib/fleet.py and lib/run.py,
# among others) had never run in CI at all, so a divergence between the
# Python and Rust implementations of the same fix (the SYS/FLEET tab-mark
# bug, the --reconnect backoff) shipped in the Python side and sat
# unnoticed in Rust until an audit found it by hand.
rust-test:
  tags: [homelab]
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  image: rust:1-bookworm
  script:
    - for pkg in fleet-poll run; do (cd rust/$pkg && cargo test) || exit 1; done

# rust-release: cross-compiles the optional Rust rewrites (rust/fleet-poll,
# rust/run -- see their own README, and #32) for both architectures the
# brain runs on, only at a tag: cross-compiling is slow and a normal push
# to dev/main doesn't need it. Plain rustup targets + a musl cross-linker
# for aarch64, no docker: this runner shares its docker socket into every
# job (what makes docker:27-cli work for install/distros above), and a
# `cross`-based approach -- its normal way of cross-compiling with musl --
# tried and failed twice against that exact shape (confirmed by two real
# tag pipelines): its target container is a sibling of this one over that
# one shared socket, not nested inside it, so cross's bind-mount of the
# project dir and $CARGO_HOME pointed at a path that only exists in this
# container's own overlay ("cargo: not found"); its own documented
# in-container-CI switch then failed the same way trying to `docker
# inspect` itself by hostname, which GitLab's docker executor doesn't set
# to the container's own ID. Skips that whole problem by never spawning a
# second container. rust:1-bookworm, not alpine: rustup's own host-tuple
# detection picks a musl toolchain on Alpine, which then needs
# libgcc_s.so.1 that a minimal Alpine image doesn't have. tests/release.py
# (`--main` only, see sync_github_binaries()) picks up this job's own
# artifacts by id (the API directly -- `glab job artifact`'s own ref+job
# lookup 404ed against a real tag pipeline in testing, even though the
# same artifact downloads fine by job id) and attaches them to the GitHub
# mirror's release, which is where install.sh's fetch() looks for them.
rust-release:
  tags: [homelab]
  image: rust:1-bookworm
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"
  timeout: 30m
  variables:
    CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-gcc
  before_script:
    - rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
    # musl-tools: musl-gcc, the linker rustc expects by convention for its
    # own (x86_64) target. aarch64 has no such package in Debian's repos --
    # musl.cc's prebuilt cross toolchain is the standard stand-in.
    - apt-get update -qq && apt-get install -y -qq musl-tools >/dev/null
    - curl -fsSL https://musl.cc/aarch64-linux-musl-cross.tgz | tar -xzC /opt
    - export PATH="/opt/aarch64-linux-musl-cross/bin:$PATH"
  script:
    - export PATH="/opt/aarch64-linux-musl-cross/bin:$PATH"
    - mkdir -p dist
    - |
      for pkg in fleet-poll run; do
        for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
          (cd rust/$pkg && cargo build --release --target "$target")
          cp rust/$pkg/target/$target/release/phosphor-$pkg dist/phosphor-$pkg-$target
        done
      done
    - ls -la dist/
  artifacts:
    paths: [dist/]

# A tag vX.Y.Z publishes its release notes, once every test above passed on
# it: the tag must match VERSION, and CHANGELOG.md's "## X.Y.Z — title" section
# becomes the release (tests/release.py cuts the whole thing).
release-notes:
  tags: [homelab]
  image: alpine:3.20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    # a literal block: in plain YAML " ##" would start a comment
    - |
      V="${CI_COMMIT_TAG#v}"
      test "$(cat VERSION)" = "$V" || { echo "tag $CI_COMMIT_TAG but VERSION says $(cat VERSION)"; exit 1; }
      awk -v v="$V" 'index($0, "## " v " ")==1 || $0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
      grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no notes under ## $V"; exit 1; }
      echo "RELEASE_NAME=$(grep -m1 "^## $V" CHANGELOG.md | sed 's/^## //')" > release.env
      cat release.env
  artifacts:
    paths: [notes.md]
    reports:
      dotenv: release.env

release:
  stage: deploy
  tags: [homelab]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $CI_COMMIT_REF_PROTECTED == "true"
  needs: [release-notes, check, docs, site, zellij, install]
  script:
    - echo "releasing $RELEASE_NAME"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $RELEASE_NAME
    description: ./notes.md
