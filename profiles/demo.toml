# ─────────────────────────────────────────────────────────────
#  Phosphor Deck · demo profile
#
#  Fake machines, fake stats: `phosphor demo` runs a throwaway session
#  from this file so a screenshot or a recording never shows a real IP,
#  hostname or disk. It never touches your real profile or session.
# ─────────────────────────────────────────────────────────────

[deck]
version = 2
session = "phosphor-demo"
theme   = "p31"
demo    = true            # fleet fakes its readings instead of polling over ssh

[[hosts]]
name   = "nebula"
role   = "brain"
local  = true
mounts = ["/", "~"]

[[hosts]]
name = "forge"
role = "work"

[[hosts]]
name = "atlas"
role = "desktop"

[[hosts]]
name = "vault"
role = "storage"

[[hosts]]
name = "relay"
role = "node"

# A fixed, made-up notebook instead of your real one: `phosphor demo` seeds
# it from profiles/demo-notes.md the first time.
[notes]
folder = "~/.cache/phosphor/demo-state/notes"   # under demo-state: --stop and every new demo wipe it

[[tabs]]
name  = "SYS"
split = "rows"
panes = [
  { split = "cols", panes = [{ cmd = "phosphor fleet" }, { cmd = "phosphor adjutant", size = "25%" }] },
]

[[tabs]]
name  = "DECK"
panes = [ { cmd = "phosphor panel" } ]

[[tabs]]
name  = "NOTES"
panes = [ { cmd = "phosphor notes" } ]
